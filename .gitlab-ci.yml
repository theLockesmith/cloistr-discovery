stages:
  - test
  - build

include:
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/cloistr-rules.yml'
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/go-test.yml'
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/kaniko-build.yml'

variables:
  GO_VERSION: "1.24"
  GOPRIVATE: "git.aegis-hq.xyz"
  GOINSECURE: "git.aegis-hq.xyz"

.go-cache: &go-cache
  cache:
    key: ${CI_COMMIT_REF_SLUG}-go
    paths:
      - .go/pkg/mod/



build:
  extends: .kaniko-build
  stage: build

test:
  extends: [.go-test, .cloistr-rules]

lint:
  extends: [.go-lint, .cloistr-rules]
